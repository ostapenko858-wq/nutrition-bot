<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ам-Ам • Дневник питания</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --text-color: var(--tg-theme-text-color, #f8fafc);
      --hint-color: var(--tg-theme-hint-color, #94a3b8);
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #10b981;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .ring-bg { stroke: #1e293b; }
    .ring-cal { stroke: #10b981; transition: stroke-dashoffset 0.8s ease-in-out, stroke 0.3s; }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.7);
    }
  </style>
</head>
<body class="p-4 pb-24 select-none">
  <!-- Хедер -->
  <header class="flex items-center justify-between mb-5">
    <div>
      <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold" id="current-date">Сегодня</p>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        <span id="user-greeting">Привет!</span> 🥦
      </h1>
    </div>
    <div class="flex items-center gap-2">
      <span class="px-3 py-1 text-xs font-medium rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20" id="sync-badge">
        Синхронизировано
      </span>
    </div>
  </header>

  <!-- Главное кольцо активности: Калории & БЖУ -->
  <div class="glass-card rounded-3xl p-5 mb-5 shadow-xl relative overflow-hidden">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Калории & Баланс</span>
      <span id="percent-badge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">0%</span>
    </div>
    
    <div class="flex items-center justify-center my-3 relative">
      <svg class="w-48 h-48 transform -rotate-90" viewBox="0 0 100 100">
        <!-- Фон кольца -->
        <circle cx="50" cy="50" r="40" stroke-width="7" class="ring-bg" fill="transparent" />
        <!-- Кольцо калорий -->
        <circle id="cal-circle" cx="50" cy="50" r="40" stroke-width="7" stroke-linecap="round" class="ring-cal" fill="transparent"
                stroke-dasharray="251.2" stroke-dashoffset="251.2" />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <span class="text-3xl font-extrabold text-white" id="eaten-cal">0</span>
        <span class="text-xs text-slate-400 font-medium" id="target-cal-label">из 2000 ккал</span>
      </div>
    </div>

    <!-- Индикаторы БЖУ с цветными мини-барами -->
    <div class="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-slate-700/60 text-center">
      <div class="p-2.5 rounded-2xl bg-slate-800/50 border border-slate-700/40 flex flex-col justify-between">
        <span class="text-[10px] uppercase font-semibold text-sky-400">Белки</span>
        <p class="text-base font-bold text-white my-1" id="val-protein">0 <span class="text-xs font-normal text-slate-400">/ 130г</span></p>
        <div class="w-full bg-slate-700/50 h-1.5 rounded-full overflow-hidden">
          <div id="bar-protein" class="bg-sky-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
      <div class="p-2.5 rounded-2xl bg-slate-800/50 border border-slate-700/40 flex flex-col justify-between">
        <span class="text-[10px] uppercase font-semibold text-amber-400">Жиры</span>
        <p class="text-base font-bold text-white my-1" id="val-fat">0 <span class="text-xs font-normal text-slate-400">/ 65г</span></p>
        <div class="w-full bg-slate-700/50 h-1.5 rounded-full overflow-hidden">
          <div id="bar-fat" class="bg-amber-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
      <div class="p-2.5 rounded-2xl bg-slate-800/50 border border-slate-700/40 flex flex-col justify-between">
        <span class="text-[10px] uppercase font-semibold text-purple-400">Углеводы</span>
        <p class="text-base font-bold text-white my-1" id="val-carbs">0 <span class="text-xs font-normal text-slate-400">/ 220г</span></p>
        <div class="w-full bg-slate-700/50 h-1.5 rounded-full overflow-hidden">
          <div id="bar-carbs" class="bg-purple-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Водный трекер -->
  <div class="glass-card rounded-3xl p-5 mb-5 shadow-xl">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span class="text-lg">💧</span>
        <div>
          <h3 class="text-sm font-bold text-white">Водный баланс</h3>
          <p class="text-xs text-slate-400" id="water-status">0 из 2000 мл</p>
        </div>
      </div>
      <span class="text-xs font-bold text-sky-400" id="water-percent">0%</span>
    </div>
    
    <!-- Прогресс воды -->
    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden mb-4">
      <div id="water-bar" class="bg-sky-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
    </div>

    <!-- Быстрые кнопки добавления воды -->
    <div class="grid grid-cols-3 gap-2">
      <button onclick="addWater(250)" class="py-2.5 rounded-xl bg-slate-800/80 active:bg-sky-500/20 active:border-sky-500 border border-slate-700 text-xs font-semibold text-slate-200 transition-all flex items-center justify-center gap-1">
        +250 мл 🥤
      </button>
      <button onclick="addWater(350)" class="py-2.5 rounded-xl bg-slate-800/80 active:bg-sky-500/20 active:border-sky-500 border border-slate-700 text-xs font-semibold text-slate-200 transition-all flex items-center justify-center gap-1">
        +350 мл 🥛
      </button>
      <button onclick="addWater(500)" class="py-2.5 rounded-xl bg-slate-800/80 active:bg-sky-500/20 active:border-sky-500 border border-slate-700 text-xs font-semibold text-slate-200 transition-all flex items-center justify-center gap-1">
        +500 мл 🫗
      </button>
    </div>
  </div>

  <!-- Чек-ин сна и настроя -->
  <div class="glass-card rounded-3xl p-5 mb-5 shadow-xl flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-xl">
        ☀️
      </div>
      <div>
        <h4 class="text-sm font-bold text-white">Настрой на день</h4>
        <p class="text-xs text-slate-400" id="mood-label">Чек-ин готовности</p>
      </div>
    </div>
    <div class="text-right">
      <span class="text-lg font-extrabold text-emerald-400" id="mood-score">—</span>
    </div>
  </div>

  <!-- Связь с тренером -->
  <a href="https://t.me/VolkovaYasno?text=%D0%9F%D1%80%D0%B8%D0%B2%D0%B5%D1%82%2C%20%D1%83%20%D0%BC%D0%B5%D0%BD%D1%8F%20%D1%81%D0%B5%D0%B3%D0%BE%D0%B4%D0%BD%D1%8F%20%D0%BD%D0%B5%20%D0%BE%D1%87%D0%B5%D0%BD%D1%8C%20%D0%BE%D1%89%D1%83%D1%89%D0%B5%D0%BD%D0%B8%D1%8F%2C%20%D0%BD%D1%83%D0%B6%D0%BD%D0%B0%20%D1%81%20%D1%82%D0%BE%D0%B1%D0%BE%D0%B9%20%D0%B1%D0%B5%D1%81%D0%B5%D0%B4%D0%B0"
     target="_blank"
     class="block w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-center text-sm shadow-lg shadow-emerald-500/20 active:opacity-90 transition-all">
    💬 Написать тренеру (@VolkovaYasno)
  </a>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Текущая дата
    const now = new Date();
    const todayISO = now.toISOString().slice(0, 10);
    const monthsRu = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
    const weekdaysRu = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
    document.getElementById('current-date').innerText = `${now.getDate()} ${monthsRu[now.getMonth()]}, ${weekdaysRu[now.getDay()]}`;

    // Чтение параметров из URL
    const urlParams = new URLSearchParams(window.location.search);
    const hasParams = urlParams.has('cal') || urlParams.has('target_cal');

    // Кэш из localStorage
    const savedDataStr = localStorage.getItem('am_nutrition_state');
    let savedData = null;
    try {
      if (savedDataStr) savedData = JSON.parse(savedDataStr);
    } catch (e) {}

    let data = {};

    if (hasParams) {
      // 1. Приоритет: свежие реальные данные из URL бота
      data = {
        date: urlParams.get('d') || todayISO,
        name: urlParams.get('name') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : 'Анастасия'),
        eatenCal: parseInt(urlParams.get('cal')) || 0,
        targetCal: parseInt(urlParams.get('target_cal')) || 1350,
        protein: parseInt(urlParams.get('p')) || 0,
        targetP: parseInt(urlParams.get('tp')) || 95,
        fat: parseInt(urlParams.get('f')) || 0,
        targetF: parseInt(urlParams.get('tf')) || 42,
        carbs: parseInt(urlParams.get('c')) || 0,
        targetC: parseInt(urlParams.get('tc')) || 145,
        waterMl: parseInt(urlParams.get('water')) || 0,
        targetWater: 2000,
        moodScore: urlParams.get('mood_score') || '',
        moodText: urlParams.get('mood_text') || ''
      };
      // Сохраняем в localStorage на сегодня
      localStorage.setItem('am_nutrition_state', JSON.stringify(data));
    } else if (savedData && savedData.date === todayISO) {
      // 2. Восстанавливаем сохранённые за сегодня данные (если открыли через меню бота)
      data = savedData;
    } else {
      // 3. Новый день без параметров: начинаем с 0!
      const userFirstName = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : (savedData ? savedData.name : 'Анастасия'));
      data = {
        date: todayISO,
        name: userFirstName,
        eatenCal: 0,
        targetCal: (savedData && savedData.targetCal) ? savedData.targetCal : 1350,
        protein: 0,
        targetP: (savedData && savedData.targetP) ? savedData.targetP : 95,
        fat: 0,
        targetF: (savedData && savedData.targetF) ? savedData.targetF : 42,
        carbs: 0,
        targetC: (savedData && savedData.targetC) ? savedData.targetC : 145,
        waterMl: 0,
        targetWater: 2000,
        moodScore: '',
        moodText: 'Чек-ин ещё не пройден'
      };
      localStorage.setItem('am_nutrition_state', JSON.stringify(data));
    }

    // Отрисовка значений
    document.getElementById('user-greeting').innerText = `Привет, ${data.name}!`;
    document.getElementById('eaten-cal').innerText = data.eatenCal;
    document.getElementById('target-cal-label').innerText = `из ${data.targetCal} ккал`;

    document.getElementById('val-protein').innerHTML = `${data.protein} <span class="text-xs font-normal text-slate-400">/ ${data.targetP}г</span>`;
    document.getElementById('val-fat').innerHTML = `${data.fat} <span class="text-xs font-normal text-slate-400">/ ${data.targetF}г</span>`;
    document.getElementById('val-carbs').innerHTML = `${data.carbs} <span class="text-xs font-normal text-slate-400">/ ${data.targetC}г</span>`;

    // Мини-бары БЖУ
    const pPct = Math.min(100, Math.round((data.protein / (data.targetP || 1)) * 100));
    const fPct = Math.min(100, Math.round((data.fat / (data.targetF || 1)) * 100));
    const cPct = Math.min(100, Math.round((data.carbs / (data.targetC || 1)) * 100));
    document.getElementById('bar-protein').style.width = `${pPct}%`;
    document.getElementById('bar-fat').style.width = `${fPct}%`;
    document.getElementById('bar-carbs').style.width = `${cPct}%`;

    // Анимация главного кольца калорий
    const calPct = data.targetCal > 0 ? (data.eatenCal / data.targetCal) : 0;
    const clampedPct = Math.min(1.0, calPct);
    const circle = document.getElementById('cal-circle');
    const circumference = 2 * Math.PI * 40; // 251.2
    const offset = circumference - (clampedPct * circumference);
    circle.style.strokeDashoffset = offset;

    const badge = document.getElementById('percent-badge');
    const pctNum = Math.round(calPct * 100);
    badge.innerText = `${pctNum}%`;
    if (pctNum > 105) {
      circle.style.stroke = "#f43f5e"; // коралл/красный при переборе
      badge.className = "text-xs font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400";
    } else {
      circle.style.stroke = "#10b981";
      badge.className = "text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400";
    }

    // Чек-ин
    if (data.moodScore) {
      document.getElementById('mood-score').innerText = `${data.moodScore}/10`;
      const score = parseInt(data.moodScore);
      document.getElementById('mood-score').className = score >= 7 ? "text-lg font-extrabold text-emerald-400" : (score >= 4 ? "text-lg font-extrabold text-amber-400" : "text-lg font-extrabold text-rose-400");
    } else {
      document.getElementById('mood-score').innerText = "—";
    }
    if (data.moodText) {
      document.getElementById('mood-label').innerText = data.moodText;
    }

    // Вода
    function updateWaterUI() {
      const pct = Math.min(100, Math.round((data.waterMl / data.targetWater) * 100));
      document.getElementById('water-status').innerText = `${data.waterMl} из ${data.targetWater} мл`;
      document.getElementById('water-percent').innerText = `${pct}%`;
      document.getElementById('water-bar').style.width = `${pct}%`;
    }
    updateWaterUI();

    function addWater(amount) {
      data.waterMl += amount;
      updateWaterUI();
      localStorage.setItem('am_nutrition_state', JSON.stringify(data));
      if (tg) {
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        try {
          tg.sendData(JSON.stringify({ action: 'add_water', amount: amount }));
        } catch (e) {}
      }
    }
  </script>
</body>
</html>
